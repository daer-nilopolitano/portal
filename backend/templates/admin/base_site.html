{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  .admin-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--header-link-color);
    text-decoration: none;
  }
  .admin-brand img {
    height: 32px;
    width: auto;
  }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}" class="admin-brand">
    <img src="{% static 'img/logo.png' %}" alt="">
    <span>{{ site_header }}</span>
  </a>
</div>
{% endblock %}
